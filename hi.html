<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Website</title>

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .box-text {
      font-size: 50px;
      padding: 20px 40px;
      margin: 50px auto;
      border: 40px solid rgb(153, 255, 0);
      border-radius: 40px;
      width: fit-content;
      text-align: center;
      transition: all 1s ease;
      cursor: pointer;
    }

    .box-text:hover {
      transform: scale(1.3);
      background-color: #A47864;
      color: white;
    }

    ul {
      list-style-type: none;
    }

    li {
      margin-bottom: 30px;
    }

    .animate-text {
      font-size: 40px;
      color: red;
      animation: fadeMove 2s infinite;
      text-align: center;
      margin-top: 100px;
    }

    @keyframes fadeMove {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      50% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-20px);
      }
    }
  </style>
</head>

<body>

  <div class="box-text">My Website</div>

  <ul>
    <li>
      <h3 style="color: orange;">If you want to see any web series in this world</h3>
      <a href="https://bolly4u.immo/" target="_blank">
        <h1 style="color: red;">bolly4u</h1>
      </a>
    </li>

    <li>
      <h3 style="color: orange;">If you want to learn something new</h3>
      <a href="https://learning.sap.com/" target="_blank">
        <h1 style="color: red;">SAP</h1>
      </a>
    </li>

    <li>
      <h3 style="color: orange;">If you want to search something</h3>
      <a href="https://chatgpt.com/" target="_blank">
        <h1 style="color: red;">ChatGPT</h1>
      </a>
    </li>

    <li>
      <h3 style="color: orange;">If you want to see videos</h3>
      <a href="https://www.youtube.com/" target="_blank">
        <h1 style="color: red;">YouTube</h1>
      </a>
      
    </li>
  </ul>

  <h1 class="animate-text">See you soon</h1>

</body>
</html>
